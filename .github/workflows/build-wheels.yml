name: Build wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            artifact: linux-x86_64
            runner: ubuntu-24.04
            platform: linux
            jobs: 2
          - name: Linux ARM64
            artifact: linux-aarch64
            runner: ubuntu-24.04-arm
            platform: linux
            jobs: 2
          - name: macOS Intel
            artifact: macos-x86_64
            runner: macos-15-intel
            platform: macos
            jobs: 4
          - name: macOS Apple Silicon
            artifact: macos-arm64
            runner: macos-15
            platform: macos
            jobs: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        if: matrix.platform == 'macos'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install macOS build tools
        if: matrix.platform == 'macos'
        run: >-
          python -m pip install
          build==1.2.2.post1
          cmake==3.31.10
          delocate==0.13.0
          ninja==1.13.0
          numpy==1.26.4
          scikit-build-core==0.11.6
          setuptools-scm==8.3.1

      - name: Build and verify manylinux wheel
        if: matrix.platform == 'linux'
        run: python3 build_manylinux.py --engine docker --jobs ${{ matrix.jobs }}

      - name: Build and verify macOS wheel
        if: matrix.platform == 'macos'
        run: python build_macos.py --jobs ${{ matrix.jobs }}

      - name: Upload wheel and checksum
        uses: actions/upload-artifact@v7
        with:
          name: adios2-compressors-${{ matrix.artifact }}
          path: |
            wheelhouse/*.whl
            wheelhouse/*.whl.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
